name: Vendor site fonts (one-time)
on:
  push:
    branches:
      - perf/self-host-subset-fonts
    paths:
      - scripts/vendor-fonts.py
      - .github/workflows/vendor-site-fonts.yml
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font subsetter
        run: python -m pip install "fonttools[woff]==4.60.0" brotli
      - name: Generate and inspect pinned local WOFF2
        run: python scripts/vendor-fonts.py
      - name: Commit binary assets and original licenses
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/fonts/*.woff2 public/assets/fonts/LICENSE-*.txt
          git diff --cached --quiet && exit 0
          git commit -m "assets: vendor subset Inter and Orbitron WOFF2 from pinned OFL sources"
          git push origin HEAD:perf/self-host-subset-fonts
