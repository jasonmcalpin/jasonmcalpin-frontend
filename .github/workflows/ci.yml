name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  build:
    # A closed PR only needs the staging reset job, not a build of the closed branch.
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure production tag refers to a main-branch commit
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Production tags must use vMAJOR.MINOR.PATCH"; exit 1;
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tagged commit is not on main"; exit 1;
          }

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn type-check

      - name: Unit tests
        run: yarn test:run

      - name: Build project
        env:
          VITE_GTM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.GTM_ID || '' }}
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 1

  windows-build:
    name: Windows build portability
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install from the canonical Yarn lockfile
        run: corepack yarn install --frozen-lockfile --non-interactive
      - name: Check Windows tests and static build
        run: |
          corepack yarn test:run
          corepack yarn build
      - name: Confirm Apache config was copied
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/.htaccess')) { throw 'dist/.htaccess missing from published output' }

  lighthouse:
    name: Lighthouse baseline (informational)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout configuration
        uses: actions/checkout@v5
      - name: Download verified production build
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/
      - name: Check Lighthouse diagnostic reporter
        run: node --test scripts/report-lighthouse-diagnostics.node-test.mjs
      - name: Collect browser quality baseline
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Summarize Lighthouse bottlenecks
        if: always()
        run: node scripts/report-lighthouse-diagnostics.mjs

      - name: Upload machine-readable Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-diagnostics
          path: |
            .lighthouseci/diagnostics.json
            .lighthouseci/diagnostics.md
          if-no-files-found: warn
          retention-days: 90

  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: website-staging
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/
      - name: Identify PR preview
        shell: bash
        run: |
          echo "PR ${{ github.event.number }} deployed at $(date -u)" > dist/PR_INFO.txt
      - name: Deploy to shared staging site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "dist/"
          target: "${{ secrets.FTP_TARGET_PREVIEW }}"
          strip_components: 1
      - name: Comment on PR with staging URL
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Deployed to shared staging: https://staged.jasonmcalpin.com (subsequent previews may replace this build).'
            });

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: website-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/
      - name: Deploy tagged release to production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "dist/"
          target: ${{ secrets.FTP_TARGET }}
          strip_components: 1

  deploy-staging-after-merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: website-staging
      cancel-in-progress: false
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/
      - name: Identify main branch deployment
        run: echo "Main branch deployed at $(date -u)" > dist/BRANCH_INFO.txt
      - name: Deploy main to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "dist/"
          target: "${{ secrets.FTP_TARGET_PREVIEW }}"
          strip_components: 1

  reset-staging-on-pr-close:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: website-staging
      cancel-in-progress: false
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Verify main before staging reset
        run: |
          yarn lint
          yarn type-check
          yarn test:run
      - name: Build main for staging
        env:
          VITE_GTM_ID: ''
        run: yarn build
      - name: Identify staging reset
        shell: bash
        run: |
          echo "Reset to main after PR ${{ github.event.number }} closed at $(date -u)" > dist/RESET_INFO.txt
      - name: Deploy main to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "dist/"
          target: "${{ secrets.FTP_TARGET_PREVIEW }}"
          strip_components: 1
