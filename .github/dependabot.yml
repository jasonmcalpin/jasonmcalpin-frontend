# Dependabot: vulnerability remediation only.
# GitHub repository Settings > Security and quality > Advanced Security
# must have Dependabot alerts and Dependabot security updates enabled.
# Routine version upgrades are reviewed during normal feature work.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Suppress routine version-update PRs, NOT security-update PRs.
    open-pull-requests-limit: 0
    assignees:
      - "jasonmcalpin"
    labels:
      - "dependencies"
      - "security"
    groups:
      vulnerable-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
